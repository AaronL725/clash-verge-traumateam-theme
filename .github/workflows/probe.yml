name: Probe Actions
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > .actions-probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .actions-probe
          git commit -m "chore: verify GitHub Actions"
          git push
