name: Clean temporary publishing files

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary publishing files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build
          rm -f .materialize.log .actions-probe
          rm -f .github/workflows/materialize-assets.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: clean temporary publishing files"
          git pull --rebase origin main
          git push origin HEAD:main
