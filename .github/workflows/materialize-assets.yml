name: Materialize theme assets

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and publish release files
        shell: bash
        run: |
          set +e
          mkdir -p assets
          : > .materialize.log

          base64 -d .build/css.gz.b64 | gzip -d > trauma-team-liquid-glass.css
          echo "css_decode=$?" >> .materialize.log

          cat .build/home-dashboard.* | base64 -d > assets/home-dashboard.webp
          echo "home_decode=$?" >> .materialize.log

          cat .build/rules-page.* | base64 -d > assets/rules-page.webp
          echo "rules_decode=$?" >> .materialize.log

          cat .build/theme-settings.* | base64 -d > assets/theme-settings.webp
          echo "settings_decode=$?" >> .materialize.log

          sha256sum trauma-team-liquid-glass.css assets/*.webp >> .materialize.log 2>&1
          file trauma-team-liquid-glass.css assets/*.webp >> .materialize.log 2>&1
          wc -c trauma-team-liquid-glass.css assets/*.webp >> .materialize.log 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trauma-team-liquid-glass.css assets/ .materialize.log

          if git diff --cached --quiet; then
            echo "No generated changes." >> .materialize.log
            exit 0
          fi

          git commit -m "feat: publish Trauma Team Liquid Glass theme"
          git pull --rebase origin main
          git push origin HEAD:main
