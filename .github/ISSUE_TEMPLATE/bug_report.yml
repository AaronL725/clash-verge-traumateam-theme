name: 兼容性或显示问题
about: 报告主题在 Clash Verge Rev 中的显示或交互问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请尽量完整填写以下信息。
  - type: input
    id: verge-version
    attributes:
      label: Clash Verge Rev 版本
      placeholder: 例如 v2.5.2
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: 操作系统
      placeholder: 例如 macOS 26
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: 问题页面
      options:
        - Home
        - Proxies
        - Profiles
        - Connections
        - Rules
        - Logs
        - Test
        - Settings
        - Dialog / Menu / Popover
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 可直接拖入图片或视频。
  - type: checkboxes
    id: accessibility
    attributes:
      label: 辅助功能设置
      options:
        - label: 已启用“减少透明度”
        - label: 已启用“减少动态效果”
